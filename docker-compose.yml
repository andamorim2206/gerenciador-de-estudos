services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: estudos
      POSTGRES_USER: estudos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-estudos}
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Só acessível desta máquina (para abrir num cliente como DBeaver ou psql).
    ports:
      - "127.0.0.1:${PG_PORTA:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estudos -d estudos"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  app:
    build: .
    image: gerenciador-de-estudos
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: estudos
      DB_USER: estudos
      DB_PASSWORD: ${DB_PASSWORD:-estudos}
    ports:
      - "${PORTA:-8000}:8000"
    volumes:
      - ./data:/app/data
    # Roda com o mesmo usuário do host para que os arquivos em data/ continuem seus.
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped

volumes:
  pgdata:
